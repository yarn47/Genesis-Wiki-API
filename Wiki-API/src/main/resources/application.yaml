spring:
  config:
    # 실행 위치(Wiki-API 폴더 또는 저장소 루트)의 .env를 읽음. OS 환경변수가 있으면 그쪽이 우선
    import: optional:file:.env[.properties],optional:file:Wiki-API/.env[.properties]
  application:
    name: Wiki-API
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080