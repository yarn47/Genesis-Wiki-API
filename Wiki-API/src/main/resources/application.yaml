spring:
  config:
    # 실행 위치(Wiki-API 폴더 또는 저장소 루트)의 .env를 읽음. OS 환경변수가 있으면 그쪽이 우선
    import: optional:file:.env[.properties],optional:file:Wiki-API/.env[.properties]
  application:
    name: Wiki-API
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        # 지연 로딩 컬렉션을 IN 절로 묶어서 가져온다 (상세 조회 N+1 방지)
        hibernate:
          default_batch_fetch_size: 50

server:
  port: 8080
  # Caddy(HTTPS) 뒤에서 X-Forwarded-Proto/Host를 반영 (내부 프록시에서 온 헤더만 신뢰)
  forward-headers-strategy: native